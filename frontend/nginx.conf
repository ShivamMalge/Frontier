# Serves the built SPA and proxies the API, so the browser sees one origin in
# the container exactly as it does behind the Vite dev server.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames: safe to keep for a year. index.html is not, or a deploy
    # would serve an old page pointing at assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /portfolio is a React route, not a file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve `api` per request rather than once at startup. nginx caches
        # the upstream's address when it parses a literal proxy_pass, so
        # recreating the API container -- a restart, a redeploy, `compose up`
        # after an image change -- leaves the UI serving 502 until nginx itself
        # is restarted. A variable in proxy_pass forces re-resolution through
        # Docker's embedded DNS, and $request_uri keeps the path that the
        # literal form would have passed through.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A pipeline run is a job, so requests here are short -- but an ingest
        # of a wide universe is not. Give it room rather than cutting it off.
        proxy_read_timeout 300s;
    }

    location /health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $health_upstream http://api:8000;
        proxy_pass $health_upstream/health;
        proxy_set_header Host $host;
    }
}
