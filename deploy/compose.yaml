# API + worker + Redis.
#
# Run it from the repository root, where the build contexts resolve:
#
#   docker compose -f deploy/compose.yaml up --build   # UI :8080, API :8000
#   docker compose -f deploy/compose.yaml up -d --scale worker=4
#   docker compose -f deploy/compose.yaml run --rm api frontier --tickers AAPL MSFT
#
# Exporting COMPOSE_FILE=deploy/compose.yaml drops the flag; CI does exactly that.
#
# The API and the worker are the same image with different commands, so a job
# submitted to one runs the identical code in the other.

x-frontier: &frontier
  # One image for both services. Only `api` declares the build: two services
  # building the same tag race each other and collide when tagging.
  image: frontier:local
  environment:
    # In a container Redis is always there, so a silent fallback to the
    # in-process queue would hide a broken broker. Fail loudly instead.
    SO_JOB_BACKEND: redis
    SO_REDIS_URL: redis://redis:6379/0
    # The store is the reproducible source; ingest into it with
    # POST /api/v1/data/ingest before switching off yfinance.
    SO_MARKET_DATA_SOURCE: ${SO_MARKET_DATA_SOURCE:-yfinance}
    SO_DATA_ROOT: /srv/data/store
    SO_MLFLOW_ENABLED: ${SO_MLFLOW_ENABLED:-false}
    SO_MLFLOW_TRACKING_URI: sqlite:////srv/data/mlflow.db
  volumes:
    # One volume for both: the worker writes the store and the tracking
    # database, the API reads them.
    - frontier-data:/srv/data
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    # Jobs are re-submittable, so persistence buys little; keep the broker
    # in memory and let it restart clean.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *frontier
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: frontier-ui:local
    ports:
      - "8080:8080"
    # nginx proxies /api and /health to the API, so the browser sees one origin
    # and CORS never applies. The API need not be published at all for the UI to
    # work; its port stays mapped only so curl and /docs remain reachable.
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *frontier
    command: ["frontier-worker"]
    # Built by `api`, above. Never pulled: frontier:local is not published
    # anywhere, so a missing image should say so rather than hit a registry.
    pull_policy: never
    # The image's healthcheck probes /health, which only the API serves. The
    # worker has no HTTP surface; `restart` covers it dying.
    healthcheck:
      disable: true
    # Forecasting is CPU-bound and scales by process: `--scale worker=N`.
    restart: unless-stopped

volumes:
  frontier-data:
