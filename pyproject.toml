# Packaging for Frontier (Phase 8 of the migration).
#
# This file replaces requirements.txt. The dependency sets are:
#
#   [project.dependencies]        everything the API, the CLI and the tests need
#   [project.optional-dependencies]
#       keras   the legacy TensorFlow backend, kept only to reproduce the
#               original result; 1.3 GB, and the backend disappears from
#               /health cleanly when it is absent
#   [dependency-groups]
#       dev     test and lint tooling; installed by `uv sync`, never shipped
#
# The package itself lives under src/frontier; see [tool.hatch.build.targets.wheel].
#
# Installing:
#   uv sync                 # runtime + dev, the working set for development
#   uv sync --no-dev        # runtime only, what the Docker image builds
#   uv sync --extra keras   # add the legacy backend
#   uv sync --all-extras    # everything

[project]
name = "frontier"
version = "0.1.0"
description = "LSTM forecasting and portfolio optimization across ten strategies."
readme = "README.md"
# Upper-bounded deliberately: the `keras` extra has no 3.13+ wheels, and 3.13 is
# untested for the rest. Raise it once the whole set is verified there.
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    # --- jobs ---
    "rq>=2.0",
    "redis>=5.0",
    # --- dataframes and storage ---
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    # --- numerical core ---
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    # --- optimization ---
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "osqp>=0.6",
    "riskfolio-lib>=7.0",
    # --- market data ---
    "yfinance>=0.2.40",
    # --- forecasting ---
    # torch resolves to the CPU wheel on Linux and Windows; see [tool.uv.sources].
    "torch>=2.4",
    "lightgbm>=4.3",
    # --- experiment tracking ---
    # The full package, not mlflow-skinny: skinny cannot use a database backend,
    # and MLflow 3 has put the filesystem backend into maintenance mode.
    "mlflow>=3.0",
]

[project.optional-dependencies]
keras = ["tensorflow-cpu>=2.17"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # In-process Redis fake: covers the RQ protocol without a server.
    "fakeredis>=2.20",
    # Bundles a real Redis server, so the multi-process worker tests can run
    # without Docker or root. tests/test_worker_process.py skips without it.
    "redislite>=6.0",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    # Hooks are opt-in per clone: `uv run pre-commit install`.
    "pre-commit>=4.0",
]

[project.scripts]
frontier = "frontier.cli:run"
frontier-worker = "frontier.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One distribution, one import name. A src/ layout means the tests import the
# installed package rather than the working directory, so a module missing from
# the wheel fails the suite instead of passing locally and breaking in Docker.
#
# The front end is not a Python package: it builds with npm and ships in its own
# image (frontend/Dockerfile).
packages = ["src/frontier"]

# A plain `pip install torch` pulls the CUDA build: ~2.5 GB of wheels that this
# project never uses, since every model here trains on CPU. The explicit index
# below is the fix, and it is why the old requirements.txt carried a comment
# telling you to pass --index-url by hand.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# macOS has no separate CPU wheel -- the default PyPI build is already CPU-only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

# --- lint and format (Phase 10) -----------------------------------------------
# One tool for both, so there is no second opinion about style. CI runs
# `ruff check` and `ruff format --check`; the pre-commit hook runs both with
# --fix so that rarely comes up.

[tool.ruff]
# 100, not 88: the numerical code reads better with the extra room, and every
# line in the repo already fits.
line-length = 100
target-version = "py312"
extend-exclude = ["venv", ".venv", "frontend", "mlruns", "data"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8 naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return paths
    "PIE",       # misc lints
    "PERF",      # obvious performance traps
    "ARG",       # unused arguments
    "DTZ",       # naive datetimes
    "BLE",       # blind excepts
    "PT",        # pytest style
    "TID",       # tidy imports
    "PL",        # pylint subset
    "RUF",       # ruff's own
]

# Each of these is off for a reason, not because it was noisy.
ignore = [
    # Imports inside functions are load-bearing here: `src/frontier/tasks.py` defers
    # heavy imports so a worker pays for them only when it runs that task, and
    # the forecasting backends import their framework lazily so a deployment
    # without torch still starts. 94 hits, all deliberate.
    "PLC0415",
    # Comparing against a literal is what a numerical test does: `assert
    # mase > 0.9`, `assert weights.sum() == 1`. Naming every threshold would
    # make the assertions harder to read, not easier.
    "PLR2004",
    # `run(returns, strategies, risk_free_rate, constraints, lookback,
    # rebalance_every, cost_bps, on_progress)` is a parameter list, not a code
    # smell. Bundling them into a config object would only move the arity.
    "PLR0913", "PLR0917",
    # Conflicts with the formatter, which is the authority on line breaks.
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# X_train, S, W: the numerical core names matrices the way the literature does,
# and renaming them to snake_case would make the formulas harder to check
# against their source, not easier.
"src/frontier/data/*.py" = ["N803", "N806"]
"src/frontier/forecasting/*.py" = ["N803", "N806"]
"src/frontier/optimization/*.py" = ["N803", "N806"]
"src/frontier/portfolio/*.py" = ["N803", "N806"]
"tests/*.py" = [
    # Fixed timestamps in fixtures, compared against stored values rather than
    # wall-clock. A timezone would add noise, not correctness.
    "DTZ001",
    # Fixtures and monkeypatched stubs must match a signature they do not use.
    "ARG001", "ARG002", "ARG005",
]

[tool.ruff.lint.isort]
known-first-party = ["frontier"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
# The numerical core and the service, not the tests measuring them.
source = ["src/frontier"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# 84, with the suite at 85.9% under branch coverage: a floor that catches a real
# regression without failing CI over a refactor that moves a few lines around.
# Raise it when the number rises; never lower it to make a build pass.
fail_under = 84
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
# `src/frontier/worker.py` reads 0%: tests/test_worker_process.py runs it as a real
# subprocess, which coverage does not follow. It is left in the measurement
# rather than omitted -- omitting it would raise the number without covering
# anything.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:frontier.*",
    # Starlette's TestClient still imports httpx 1.x; not our call to make.
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
